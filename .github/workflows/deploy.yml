name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch all history so Quartz can show "last edited" dates

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Built directly (not via a build action) so the graph renderer can be patched
      - name: Build with Quartz
        run: |
          git clone --depth 1 --branch v4 https://github.com/jackyzha0/quartz.git "$RUNNER_TEMP/quartz"
          cd "$RUNNER_TEMP/quartz"
          npm ci
          cp "$GITHUB_WORKSPACE"/.github/quartz/quartz.config.ts "$GITHUB_WORKSPACE"/.github/quartz/quartz.layout.ts .
          cp "$GITHUB_WORKSPACE"/.github/quartz/custom.scss quartz/styles/custom.scss
          python3 "$GITHUB_WORKSPACE"/.github/quartz/patch-graph.py quartz/components/scripts/graph.inline.ts
          # repo root: includes wiki/ and raw/ so [[wikilinks]] resolve
          rm -rf content && mkdir content
          cp -r "$GITHUB_WORKSPACE"/* content/
          npx quartz build -o "$GITHUB_WORKSPACE/_site"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
